name: Update website versions

# Keeps docs/releases.js (the versions shown on the website) in step with every tool's latest
# GitHub release, so the site stays current without a manual republish.
on:
  schedule:
    - cron: "17 */3 * * *"     # every 3 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths: [catalog.json, scripts/build-releases.py]

permissions:
  contents: write
  pages: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read latest releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build-releases.py
      - name: Commit if anything changed
        id: commit
        run: |
          if git diff --quiet -- docs/releases.js; then
            echo "No version changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/releases.js
            git commit -m "Update website versions"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
